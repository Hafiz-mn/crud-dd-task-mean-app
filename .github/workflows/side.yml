name: CI/CD Pipeline

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push backend Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: false
         

      - name: Build and push frontend Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: false
          
      - name: Tag images for ECR
        run: |
         docker tag backend-image public.ecr.aws/w0g4t3k7/mypub:backend
         docker tag frontend-image public.ecr.aws/w0g4t3k7/mypub:frontend

      - name: Push to ECR
        run: |
          docker push public.ecr.aws/w0g4t3k7/mypub:backend
          docker push public.ecr.aws/w0g4t3k7/mypub:frontend

     
