name: CI/CD Pipeline

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push backend Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: false
          tags: docker tag ${{ secrets.IMAGE_TAG }}:backend

      - name: Build and push frontend Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: false
          tags: docker tag ${{ secrets.IMAGE_TAG }}:frontend

      - name: Push to AWS ECR
        run: |
          docker push ${{ secrets.IMAGE_PUSH }}:frontend
          docker push ${{ secrets.IMAGE_PUSH }}:backend
       
