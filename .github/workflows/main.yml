name: Push Image to ECR

on:
  push:
   branches:
     - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Install backend dependencies
        run: |
              cd backend
              npm install
              npm ci

      - name: Run backend tests
        run: |
             cd backend
             npm test

      - name: Build backend Docker image
        run: docker build -t backend-image ./backend

      - name: Install frontend dependencies
        run: |
              cd frontend
              npm install
              npm ci

      - name: Run frontend tests
        run: |
             cd frontend
            
             npm test -- --watch=false --browsers=ChromeHeadless
      
      - name: Build and push frontend Docker image
        run: docker build -t frontend-image ./frontend

      - name: Test backend container 
        run: |
          docker run -d -p 8080:8080 --name backend-test backend-image
          sleep 10
          curl -f http://localhost:8080 || exit 1
          docker stop backend-test
          
      - name: Test frontend container
        run: |
         docker run -d -p 8081:80 --name frontend-test frontend-image
         sleep 10
         curl -f http://localhost:8081 || exit 1
         docker stop frontend-test

      - name: Scan backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: backend-image  

      - name: Scan backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: frontend-image 

          
      - name: Tag images for ECR
        run: |
         docker tag backend-image public.ecr.aws/w0g4t3k7/mypub:backend
         docker tag frontend-image public.ecr.aws/w0g4t3k7/mypub:frontend

      - name: Setup AWS ECR Details
        uses: aws-actions/configure-aws-credentials@v1
        with:
         aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
         aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
         aws-region: us-east-2
        
        
      - name: Login to Amazon ECR Public
        run: |
         aws ecr-public get-login-password --region us-east-1 | \
         docker login --username AWS --password-stdin public.ecr.aws


      - name: Push to ECR
        run: |
          docker push public.ecr.aws/w0g4t3k7/mypub:backend
          docker push public.ecr.aws/w0g4t3k7/mypub:frontend

     
